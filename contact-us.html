<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>

```
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #667eea, #764ba2);
        padding: 20px;
    }

    .contact-box {
        background: white;
        width: 90%;
        max-width: 700px;
        padding: 40px;
        border-radius: 20px;
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
    }

    h1 {
        text-align: center;
        color: #333;
        margin-bottom: 10px;
    }

    .intro {
        text-align: center;
        color: #666;
        margin-bottom: 30px;
    }

    .form-group {
        margin-bottom: 20px;
    }

    label {
        display: block;
        margin-bottom: 8px;
        color: #333;
        font-weight: bold;
    }

    input,
    textarea {
        width: 100%;
        padding: 13px;
        border: 1px solid #ccc;
        border-radius: 8px;
        font-size: 16px;
        outline: none;
    }

    input:focus,
    textarea:focus {
        border-color: #667eea;
    }

    textarea {
        height: 120px;
        resize: vertical;
    }

    .btn {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 30px;
        background: #667eea;
        color: white;
        font-size: 17px;
        cursor: pointer;
        transition: 0.3s;
    }

    .btn:hover {
        background: #764ba2;
    }

    .contact-info {
        margin-top: 30px;
        text-align: center;
        color: #666;
        line-height: 1.8;
    }

    footer {
        margin-top: 25px;
        text-align: center;
        color: #999;
        font-size: 14px;
    }
</style>
```

</head>

<body>

```
<div class="contact-box">

    <h1>Contact Us</h1>

    <p class="intro">
        We'd love to hear from you! Please fill out the form below.
    </p>

    <form>

        <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" name="name"
                   placeholder="Enter your name" required>
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email"
                   placeholder="Enter your email" required>
        </div>

        <div class="form-group">
            <label for="subject">Subject</label>
            <input type="text" id="subject" name="subject"
                   placeholder="Enter subject">
        </div>

        <div class="form-group">
            <label for="message">Message</label>
            <textarea id="message" name="message"
                      placeholder="Enter your message" required></textarea>
        </div>

        <button type="submit" class="btn">
            Send Message
        </button>

    </form>

    <div class="contact-info">
        <p>📧 Email: example@email.com</p>
        <p>📞 Phone: +91 98765 43210</p>
        <p>📍 Address: Chennai, Tamil Nadu, India</p>
    </div>

    <footer>
        © 2026 My Website. All Rights Reserved.
    </footer>

</div>
```

</body>
</html>
