<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        min-height: 100vh;
        background: linear-gradient(135deg, #667eea, #764ba2);
    }

    nav {
        background: white;
        padding: 18px;
        text-align: center;
    }

    nav a {
        text-decoration: none;
        color: #333;
        margin: 0 20px;
        font-weight: bold;
    }

    nav a:hover {
        color: #667eea;
    }

    .container {
        width: 90%;
        max-width: 1100px;
        margin: 40px auto;
        background: white;
        padding: 35px;
        border-radius: 20px;
        box-shadow: 0 15px 40px rgba(0,0,0,0.25);
    }

    h1 {
        text-align: center;
        color: #333;
        margin-bottom: 10px;
    }

    .intro {
        text-align: center;
        color: #666;
        margin-bottom: 30px;
    }

    .gallery {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
    }

    .gallery img {
        width: 100%;
        height: 220px;
        object-fit: cover;
        border-radius: 12px;
        transition: 0.3s;
    }

    .gallery img:hover {
        transform: scale(1.05);
    }

    footer {
        text-align: center;
        color: white;
        padding: 15px;
    }

    @media (max-width: 700px) {
        .gallery {
            grid-template-columns: 1fr;
        }
    }
</style>

</head>

<body>

<nav>
    <a href="index.html">Home</a>
    <a href="welcome.html">Welcome</a>
    <a href="gallery.html">Gallery</a>
    <a href="about-us.html">About Us</a>
    <a href="contact-us.html">Contact Us</a>
</nav>

<div class="container">

    <h1>Our Gallery 📸</h1>

    <p class="intro">
        Explore some beautiful moments from our collection.
    </p>

    <div class="gallery">

        <img src="https://picsum.photos/500/300?random=1" alt="Gallery Image 1">
        <img src="https://picsum.photos/500/300?random=2" alt="Gallery Image 2">
        <img src="https://picsum.photos/500/300?random=3" alt="Gallery Image 3">
        <img src="https://picsum.photos/500/300?random=4" alt="Gallery Image 4">
        <img src="https://picsum.photos/500/300?random=5" alt="Gallery Image 5">
        <img src="https://picsum.photos/500/300?random=6" alt="Gallery Image 6">

    </div>

    <p style="text-align: center; margin-top: 30px;"><a href="index.html">&larr; Back to Home</a></p>

</div>

<footer>
    © 2026 My Website. All Rights Reserved.
</footer>

</body>
</html>
