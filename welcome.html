<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome Page</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #667eea, #764ba2);
    }

    .welcome-box {
        background: white;
        padding: 50px;
        width: 90%;
        max-width: 600px;
        text-align: center;
        border-radius: 20px;
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
    }

    h1 {
        color: #333;
        font-size: 42px;
        margin-bottom: 15px;
    }

    p {
        color: #666;
        font-size: 18px;
        margin-bottom: 30px;
    }

    .btn {
        display: inline-block;
        padding: 14px 30px;
        background: #667eea;
        color: white;
        text-decoration: none;
        border-radius: 30px;
        font-size: 16px;
        transition: 0.3s;
    }

    .btn:hover {
        background: #764ba2;
        transform: scale(1.05);
    }

    footer {
        margin-top: 30px;
        color: #999;
        font-size: 14px;
    }
</style>

</head>

<body>

<div class="welcome-box">
    <h1>Welcome! 👋</h1>

    <p>
        Welcome to our website.  
        We are happy to have you here!
    </p>

    <a href="index.html" class="btn">Get Started</a>

    <p><a href="index.html" class="btn">&larr; Back to Home</a></p>

    <p class="page-links">
        <a href="index.html">Home</a> |
        <a href="gallery.html">Gallery</a> |
        <a href="about-us.html">About Us</a> |
        <a href="contact-us.html">Contact Us</a>
    </p>

    <footer>
        © 2026 My Website. All Rights Reserved.
    </footer>
</div>

</body>
</html>
